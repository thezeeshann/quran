[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "xtask"]
default-members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/thezeeshann/quran-rs"

[workspace.dependencies]
quran-core = { path = "crates/core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
zstd = { version = "0.13", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
